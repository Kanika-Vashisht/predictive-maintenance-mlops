[project]
name = "predictive-maintenance-mlops"
version = "0.1.0"
description = "An end-to-end predictive maintenance machine learning and MLOps pipeline"
readme = "README.md"
authors = [
    { name = "Kanika Vashisht", email = "kanikavashisht3122@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
]

[project.scripts]
predictive-maintenance-mlops = "predictive_maintenance_mlops:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]


[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]